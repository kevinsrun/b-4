spec_version: 1

name: bacteriocin-discovery-lead
description: >
  Orchestration-side harness for the bacteriocin-discovery loop. Calls the
  Candidate Generation & Design Agent over MCP and reports its proposals
  without ever restating them as experimental findings.

# No llm block: the model comes from `omnigent config` or `--model`, so the
# bundle stays portable across whatever credential is configured.

tools:
  # Read-only. This agent reads the candidate generator's output; it has no
  # reason to write files or run commands, and withholding that keeps a model
  # from "fixing" the scientific output by editing the repository.
  timeout: 120
