[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critic-agent"
version = "0.1.0"
description = "Scientific critic / safety agent for the B-4 bacteriocin-discovery lab"
readme = "README.md"
requires-python = ">=3.11"
# Depends on the shared contract rather than re-declaring it. A critic whose
# copy of EvidenceType can drift from everyone else's would validate against
# the wrong vocabulary -- the one failure mode this agent exists to prevent.
# The contract currently lives in bacteriocin-discovery; see README.
dependencies = [
    "pydantic>=2.5,<3",
    "bacteriocin-discovery",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["critic_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
