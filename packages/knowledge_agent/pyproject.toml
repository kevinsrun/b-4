[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-agent"
version = "0.1.0"
description = "Knowledge / research-state agent: the persistent, reconstructable scientific state of the B-4 bacteriocin lab"
readme = "README.md"
requires-python = ">=3.11"
# bacteriocin-discovery supplies the shared contract the response envelope is built
# from (and its ID helpers); bacteriocin-shared supplies the research-state schemas.
dependencies = ["pydantic>=2.5,<3", "bacteriocin-shared", "bacteriocin-discovery"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../shared", "../bacteriocin_discovery/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
