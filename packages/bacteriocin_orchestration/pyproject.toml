[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacteriocin-orchestration"
version = "0.1.0"
description = "Omnigent workflow orchestration layer for the autonomous bacteriocin-discovery lab"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "bacteriocin-sim",
    "bacteriocin-discovery",
    "b4-literature-evidence",
    "experiment-planner-agent",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]

