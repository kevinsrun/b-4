[project]
name = "bacteriocin-sim"
version = "0.1.0"
description = "Computational simulation experiment backend for the Omnigent bacteriocin-discovery lab"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bacteriocin-sim = "bacteriocin_sim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bacteriocin_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
