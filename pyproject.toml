# One installable package, ``bacteriocin_lab``, laid out as:
#
#   shared/         schemas, contract, enums, ids, config (no agent imports)
#   agents/         evidence, candidate, planner, simulator, analysis, knowledge, critic
#   adapters/       experiment backends (simulation, wet-lab stub)
#   orchestration/  workflow, routing, Omnigent adapter
#   evaluation/     benchmarks, demo scenarios, example inputs
#   tests/
#
#   uv sync                 # editable install with dev tools
#   pytest

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacteriocin-lab"
version = "0.1.0"
description = "Autonomous bacteriocin-discovery lab: evidence, candidate design, and simulated experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6", "ruff>=0.8"]
mcp = ["mcp>=1.30"]
verify = ["httpx>=0.25"]

[project.scripts]
bacteriocin-sim = "bacteriocin_lab.agents.simulator.cli:main"
bacteriocin-sim-mcp = "bacteriocin_lab.agents.simulator.mcp_server:main"
b4-literature-evidence = "bacteriocin_lab.agents.evidence.cli:main"

[tool.setuptools.packages.find]
include = ["bacteriocin_lab*"]

[tool.setuptools.package-data]
"bacteriocin_lab.agents.candidate" = ["data/*.json"]
"bacteriocin_lab.agents.evidence" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["bacteriocin_lab/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bacteriocin_lab/agents/evidence/*" = ["E501", "RUF001"]  # × is matched deliberately in regexes
"bacteriocin_lab/orchestration/*" = ["E501"]
"bacteriocin_lab/tests/integration/*" = ["E501"]  # long explanatory docstrings name the bug each test pins
