# Workspace root. The specialist modules are separate installable packages under
# packages/, each with its own pyproject.toml, dependencies and tests --
# they are deployed independently and should version independently.
#
# This file exists to make the repository installable in one step and to hold
# the settings that genuinely are repository-wide.
#
#   uv sync                                        # all packages, editable
#   uv pip install -e "packages/bacteriocin_sim[mcp]"
#   pytest                                         # both test suites

[project]
name = "bacteriocin-lab"
version = "0.1.0"
description = "Autonomous bacteriocin-discovery lab: evidence, candidate design, and simulated experiments"
# The union of the package floors. bacteriocin_discovery requires 3.11,
# so the workspace cannot claim 3.10 even though bacteriocin_sim supports it.
requires-python = ">=3.11"
dependencies = [
    "bacteriocin-sim",
    "bacteriocin-discovery",
    "b4-literature-evidence",
    "experiment-planner-agent",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
mcp = ["mcp>=1.30"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bacteriocin-sim = { workspace = true }
bacteriocin-discovery = { workspace = true }
b4-literature-evidence = { workspace = true }
experiment-planner-agent = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The root is a workspace, not a package: nothing to discover here.
packages = []

[tool.pytest.ini_options]
# All suites run from the root; each package's layout concerns stay inside
# that package.
testpaths = [
    "packages/bacteriocin_sim/tests",
    "packages/bacteriocin_discovery/tests",
    "packages/b4_literature/tests",
    "packages/experiment_planner_agent/tests",
]
pythonpath = [
    "packages/bacteriocin_sim",
    "packages/bacteriocin_discovery/src",
    "packages/b4_literature/src",
    "packages/experiment_planner_agent",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
