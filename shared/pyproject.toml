[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacteriocin-shared"
version = "0.1.0"
description = "Schemas shared by the B-4 bacteriocin-lab agents (currently: the research state)"
readme = "README.md"
requires-python = ">=3.11"
# A leaf package: it must never import an agent package, or every agent that
# depends on it would inherit a cycle.
dependencies = ["pydantic>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bacteriocin_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
