# Managed by Engineering Fleet. Regenerate with: fleet init --ci
# verification-config-sha256: 6f615037329acbcc6a8c0cdc6f2b4ccb1759f4644a8d3f9b59adf707d3bd0f99
name: Fleet Verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  fleet_lint-literature-integration:
    name: 'Fleet · Lint literature and Omnigent integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.22'
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: 'Install all verification dependencies'
        run: |
          'uv' 'sync' '--all-extras' '--frozen'
      - name: 'Generate Omnigent MCP declarations'
        run: |
          'uv' 'run' 'python' 'install.py'
      - name: 'Lint literature and Omnigent integration'
        run: |
          'uv' 'run' 'ruff' 'check' 'bacteriocin_lab/agents/evidence' 'tools/launchers/literature.py' 'bacteriocin_lab/tests/tools/test_literature_protocol.py' 'bacteriocin_lab/tests/tools/test_omnigent_manager.py' 'scripts/run_omnigent.py'
      - name: Record commit binding
        if: always()
        run: |
          echo "Fleet check: lint-literature-integration" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  fleet_lint-planner:
    name: 'Fleet · Lint experiment planner for syntax and undefined names'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.22'
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: 'Install all verification dependencies'
        run: |
          'uv' 'sync' '--all-extras' '--frozen'
      - name: 'Generate Omnigent MCP declarations'
        run: |
          'uv' 'run' 'python' 'install.py'
      - name: 'Lint experiment planner for syntax and undefined names'
        run: |
          'uv' 'run' 'ruff' 'check' 'bacteriocin_lab/agents/planner' '--select' 'E9,F63,F7,F82'
      - name: Record commit binding
        if: always()
        run: |
          echo "Fleet check: lint-planner" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

